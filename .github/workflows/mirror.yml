name: Verify and mirror official Camofox
on:
  schedule:
    - cron: '0 2 * * *' # 10:00 Asia/Shanghai
  workflow_dispatch:
    inputs:
      publish:
        description: Push tested image to Docker Hub latest
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: camofox-release-mirror
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test release selection, waiting, and no-change behavior
        run: python3 -B -m unittest -q
      - name: Validate official release and optionally publish
        env:
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKER_CONFIG: ${{ runner.temp }}/camofox-docker
        run: python3 -B mirror.py
